services:
  mongodb:
    image: mongo:7
    container_name: expense-tracker-app
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INTIDB_DATABASE: ${MONGO_DB_NAME}
    volumes: 
      - mongo-data:/data/db

volumes:
  mongo-data: